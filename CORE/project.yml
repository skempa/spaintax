name: CORE
options:
  bundleIdPrefix: app.core
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"       # iPhone only for the MVP
    DEVELOPMENT_TEAM: ""              # set your team ID, or pick it in Xcode signing settings

# ---------------------------------------------------------------------------
# Default configuration: NO special entitlements, single app target.
# This builds and runs on a free Apple ID personal team with zero setup —
# the game is fully playable; screen-time reads as zero (full 5:00 daily).
#
# To enable real Screen Time integration (requires a paid Apple Developer
# account, and Apple's Family Controls distribution approval to ship):
#   1. Uncomment the `entitlements` block below and the ActivityMonitor
#      target + dependency.
#   2. Run `xcodegen generate` again.
# ---------------------------------------------------------------------------

targets:
  CORE:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: CORE
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        NSCameraUsageDescription: >-
          CORE uses the camera to place your creature in your world.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
